<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://static-cdn.gigadrivegroup.com/resist-sans/stylesheet.css?v2" />
    <link rel="stylesheet" href="demo.css" />
    <link rel="stylesheet" href="theme-b.css" />
    <style>
      body {
        margin: 0;
      }
      html.dark,
      .dark {
        color-scheme: dark;
      }
    </style>
    <script>
      if (location.search.includes('dark')) document.documentElement.classList.add('dark');
    </script>
  </head>
  <body class="pb font-sans text-foreground antialiased">
    <div
      class="relative flex min-h-screen w-screen items-center justify-center overflow-hidden p-6"
      style="
        background:
          radial-gradient(1200px 700px at 75% -10%, hsl(150 45% 18%), transparent 60%),
          radial-gradient(900px 600px at -10% 110%, hsl(160 40% 12%), transparent 55%),
          linear-gradient(160deg, hsl(170 12% 7%), hsl(168 10% 4%) 70%);
      "
    >
      <div
        class="pointer-events-none absolute inset-0"
        style="
          background-image: radial-gradient(rgba(74, 222, 128, 0.14) 1px, transparent 1.5px);
          background-size: 22px 22px;
          mask-image: linear-gradient(to bottom, black, transparent 70%);
        "
      ></div>
      <div class="pointer-events-none absolute inset-0 bg-black/25"></div>
      <div class="dark relative z-10 w-full max-w-[450px]">
        <div
          class="card-tactile overflow-hidden rounded-2xl border border-border/80 bg-card p-8"
          style="
            box-shadow:
              inset 0 1px 0 rgba(255, 255, 255, 0.07),
              0 1px 2px rgba(0, 0, 0, 0.5),
              0 24px 60px -12px rgba(0, 0, 0, 0.7);
          "
        >
          <div class="flex flex-col items-center text-center">
            <div
              class="raised grid size-11 place-items-center rounded-xl bg-primary bg-[image:linear-gradient(to_bottom,rgba(255,255,255,0.18),transparent_60%)] text-lg font-bold text-primary-foreground"
            >
              G
            </div>
            <h1 class="mt-4 text-xl font-semibold tracking-tight">Sign in to Gigadrive</h1>
            <p class="mt-1 text-sm text-muted-foreground">One account for all Gigadrive services.</p>
          </div>
          <div class="mt-6 space-y-4">
            <div>
              <label class="mb-1.5 block text-sm font-medium">Email</label>
              <input
                type="email"
                value="you@example.com"
                class="well flex h-10 w-full rounded-lg border border-input bg-background px-3 text-sm placeholder:text-muted-foreground"
              />
            </div>
            <div>
              <div class="mb-1.5 flex items-center justify-between">
                <label class="text-sm font-medium">Password</label
                ><a class="text-xs text-primary hover:underline">Forgot password?</a>
              </div>
              <div class="relative">
                <input
                  type="password"
                  value="••••••••••••"
                  class="well flex h-10 w-full rounded-lg border border-input bg-background px-3 pr-9 text-sm"
                />
                <button class="absolute right-2.5 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground">
                  <svg
                    class="size-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>
            <button
              class="inline-flex h-10 w-full items-center justify-center gap-2 rounded-lg bg-primary bg-[image:linear-gradient(to_bottom,rgba(255,255,255,0.12),rgba(255,255,255,0.03)_40%,transparent_60%)] px-4 text-sm font-medium text-primary-foreground shadow-[inset_0_1px_2px_0_rgba(255,255,255,0.2),0_2px_4px_0_rgba(0,0,0,0.25)] hover:bg-primary/90"
            >
              Sign in
            </button>
            <button
              class="raised inline-flex h-10 w-full items-center justify-center gap-2 rounded-lg border border-input bg-card px-4 text-sm font-medium hover:bg-accent"
            >
              <svg
                class="size-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"
                /></svg
              >Sign in with a passkey
            </button>
            <div class="flex items-center gap-3 py-1">
              <div class="h-px flex-1 bg-border"></div>
              <span class="text-[11px] text-muted-foreground">or continue with</span>
              <div class="h-px flex-1 bg-border"></div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button
                class="raised inline-flex h-10 items-center justify-center gap-2 rounded-lg border border-input bg-card px-4 text-sm font-medium hover:bg-accent"
              >
                <svg
                  class="size-4"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
                  />
                  <path d="M9 18c-4.51 2-5-2-7-2" /></svg
                >GitHub
              </button>
              <button
                class="raised inline-flex h-10 items-center justify-center gap-2 rounded-lg border border-input bg-card px-4 text-sm font-medium hover:bg-accent"
              >
                <svg class="size-4" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81Z"
                  /></svg
                >Google
              </button>
            </div>
          </div>
          <p class="mt-6 text-center text-xs text-muted-foreground">
            New to Gigadrive? <a class="font-medium text-primary hover:underline">Create an account</a>
          </p>
        </div>
        <p class="mt-4 text-center text-[11px] text-white/40">
          Signing in to <span class="font-medium text-white/60">Gigadrive Console</span> ·
          <a class="hover:text-white/60">Privacy</a> · <a class="hover:text-white/60">Terms</a>
        </p>
      </div>
    </div>
  </body>
</html>
